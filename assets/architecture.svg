<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2320" viewBox="0 0 1800 2320" role="img" aria-labelledby="title description">
  <title id="title">Financial Intelligence — implemented V4-C architecture</title>
  <desc id="description">Two independent local ingestion pipelines. CompanyFacts JSON is stored as raw snapshots, normalized to Parquet, loaded into persistent DuckDB, transformed into dbt Gold tables, and queried by Python financial access. SEC Submissions metadata and Archives HTML become raw filing snapshots, Item 1A and Item 7 section Parquet, and chunk Parquet. Filing retrieval uses an in-memory DuckDB Parquet reader and Python lexical ranking; section Parquet enriches retrieved evidence with filing metadata by accession. Filing retrieval never passes through the persistent financial warehouse or dbt. AI orchestration enforces required evidence, uses the external OpenAI Responses API for tool planning and structured risk generation, validates source references, and builds responses with citations or missing-evidence notices. Financial history also feeds the Streamlit dashboard directly. Source files: run_pipeline.py; run_filings.py; src/ingestion/companyfacts.py; src/ingestion/filings.py; src/transformation/load_companyfacts.py; src/transformation/parse_filings.py; src/transformation/store_filings.py; src/transformation/chunk_filings.py; src/retrieval/search_filings.py; src/retrieval/filing_metadata.py; src/analytics/financials.py; src/analytics/financial_summary.py; src/ai/dashboard.py; src/ai/financial_intent.py; src/ai/analyst.py; src/ai/risk_generator.py; src/ai/risk_evidence.py; src/ai/response_builder.py; src/ui/analyst.py; app.py; dbt/models/gold/.</desc>
