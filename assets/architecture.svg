      .path { font-family: Consolas, "Liberation Mono", monospace; font-size: 24px; fill: #cbd5e1; }
      .small { font-size: 24px; fill: #94a3b8; }
      .financial { fill: #60a5fa; }
      .filing { fill: #5ee0bc; }
      .ai { fill: #c4a5fd; }
      .node { fill: #122036; stroke-width: 2; }
      .financial-node { stroke: #3b82c4; }
      .filing-node { stroke: #2b9c83; }
      .ai-node { stroke: #8063b8; }
      .edge { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .financial-edge { stroke: #60a5fa; marker-end: url(#blue-arrow); }
      .filing-edge { stroke: #5ee0bc; marker-end: url(#teal-arrow); }
      .ai-edge { stroke: #c4a5fd; marker-end: url(#purple-arrow); }
      .api-edge { stroke: #c4a5fd; stroke-dasharray: 9 7; marker-start: url(#api-arrow); marker-end: url(#api-arrow); }
    </style>
    <marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#60a5fa"/></marker>
    <marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5ee0bc"/></marker>
    <marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c4a5fd"/></marker>
    <marker id="api-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#c4a5fd"/></marker>
  </defs>

