<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc">
<title id="title">Financial Intelligence: implemented M006-R architecture</title>
<desc id="desc">Three local, manually invoked workflows. CompanyFacts becomes hashed raw JSON, Parquet, persistent DuckDB and dbt Gold for annual analytics. SEC filing HTML becomes hashed snapshots, sections and chunks for lexical retrieval and an external-API-assisted analyst. Selected 10-Q snapshots feed company-specific extraction, deterministic calculations and source-grounded AI notes, independent evaluation and separate human review, private saved runs, explicitly curated public bundles and Streamlit Quarterly Reports. Annual Gold also supplies analyst tools. Quarterly figures do not come from annual Gold. Saved failures and pending review states are preserved; no arrow implies automatic approval or publication.</desc>
